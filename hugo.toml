baseURL = "https://go-attest.github.io/"
title = "go-attest"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  subtitle = "signing and SBOMs for build artifacts, in pure Go"
  description = "Pure-Go supply-chain attestation for build artifacts: Ed25519 signing interoperable with both common encodings (sign) and SPDX 2.3 / CycloneDX 1.5 software bills of materials whose conformance is proven against the reference libraries (sbom)."
  tagline = "Supply-chain attestation for build artifacts — <strong>sign</strong> what you ship and <strong>say what is in it</strong>, from pure Go."
  pills = ["Ed25519", "SPDX 2.3", "CycloneDX 1.5", "CGO_ENABLED=0", "BSD-3-Clause"]
  primary_role = "signing"
  leads = [
    "An artifact needs two things said about it: <strong>who vouches for it</strong> and <strong>what is inside it</strong>. These two packages do one each, over the same bytes, so a release pipeline can emit both without a second toolchain.",
    "Conformance is not asserted, it is <strong>decoded</strong>: the SBOM output is parsed back by the reference SPDX and CycloneDX libraries in test-only code, so a document that those tools would reject cannot pass CI here."
  ]
  principles = "Both packages are ordinary Go libraries with no cgo and no external binaries, so they drop into a build pipeline that already produces the artifact — no separate signing daemon, no Node, no Python."

[[params.repos]]
  name = "sign"
  role = "signing"
  reach = "Ed25519 over the artifact bytes"
  gomod = true
  result = "Ed25519 signing that is <strong>interoperable with both</strong> encodings an artifact is distributed under. A plain signature over the same bytes either way, so one keypair covers both channels rather than forcing a choice between them."
[[params.repos]]
  name = "sbom"
  role = "inventory"
  reach = "SPDX 2.3 JSON + CycloneDX 1.5 JSON"
  gomod = true
  result = "Emits a software bill of materials for a build artifact <strong>and its dependency closure</strong>, in both formats."
  note = "Conformance is proven in test-only code by decoding the output with the reference libraries — the documents are checked by the tools that consume them, not by our own reader."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
